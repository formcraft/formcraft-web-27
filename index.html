<!doctype html>
<html lang="en-UG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Formcraft · Designing spaces. Empowering communities.</title>
    <meta name="description" content="Formcraft Design and Construction, Kampala: BIM-led design, construction, precast concrete and workshop-made furniture, in one value chain with local artisans." />
    <meta name="theme-color" content="#F1F1F1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- public pages read their content from Firestore over REST: open that connection early -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ClashGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:title" content="Formcraft" />
    <meta property="og:description" content="Designing spaces. Empowering communities." />
    <meta property="og:image" content="/images/bwebajja-night-800.webp" />
    <script>
      // Pick the paper edition before first paint: the visitor's saved choice, else Kampala's
      // clock (day from 06:45 to 18:55 EAT). Same rule as src/lib/skyClock.js.
      // Then decide the opening animation (see #fci below): full on a first visit, quick on later
      // visits, none again in the same session, a plain fade with reduced motion, never for bots.
      (function () {
        var d = document.documentElement, t = null, ls = null, ss = null;
        // Pre-rendered pages (scripts/prerender.mjs): HTML built for another address (Hosting serves index.html
        // for unknown addresses, the service worker offline) stays hidden until the app has started fresh.
        var built = document.querySelector('meta[name="fc-prerendered"]');
        if (built && built.content !== (location.pathname.replace(/\/+$/, "") || "/")) d.classList.add("fc-stale");
        try { ls = window.localStorage; ss = window.sessionStorage; t = ls.getItem("fc-theme"); } catch (e) {}
        if (t !== "day" && t !== "night") {
          var n = new Date(), m = (n.getUTCHours() * 60 + n.getUTCMinutes() + 180) % 1440;
          t = m >= 405 && m < 1135 ? "day" : "night";
        }
        d.setAttribute("data-theme", t);
        // animation timing from Admin → Motion (cached by the app on the last visit; src/data/motion.js)
        var mo = {};
        try { mo = JSON.parse(ls.getItem("fc-site-motion") || "{}") || {}; } catch (e) {}
        var k = function (v) { v = Number(v); return v >= 0.5 && v <= 3 ? v : 1; };
        window.__fcMotion = { intro: k(mo.intro), tear: k(mo.tear) };
        d.style.setProperty("--fc-motion", k(mo.reveal));
        d.style.setProperty("--fc-motion-build", k(mo.build));
        d.style.setProperty("--fci-k", window.__fcMotion.intro);
        var bot = navigator.webdriver || /bot|crawl|spider|slurp|preview|facebookexternalhit|whatsapp|embedly|skype/i.test(navigator.userAgent);
        var mode = "none";
        try {
          // Admin → Features "Opening animation" (cached by the app on the last visit; src/data/features.js)
          var off = false;
          try { off = (JSON.parse(ls.getItem("fc-site-features") || "{}") || {}).intro === false; } catch (e) {}
          if (!bot && !off && ss && !ss.getItem("fc-intro")) {
            mode = matchMedia("(prefers-reduced-motion: reduce)").matches ? "fade" : ls.getItem("fc-intro-seen") ? "quick" : "full";
            ss.setItem("fc-intro", "1");
            ls.setItem("fc-intro-seen", "1");
          }
        } catch (e) { mode = "none"; }
        if (mode !== "none") d.classList.add("fci-run", "fci-" + mode, "fci-hold");
        // Always fetch this edition's paper textures straight away: they're the backgrounds of the
        // first sections (often the page's largest element), and the browser would otherwise only
        // discover them once the CSS has loaded.
        (t === "night" ? ["/textures/black.webp?v=2", "/textures/navy.webp?v=2"] : ["/textures/paper.webp?v=2"]).forEach(function (href) {
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "image"; l.href = href; l.setAttribute("fetchpriority", "high");
          document.head.appendChild(l);
        });
      })();
    </script>
    <style>
      /* Opening animation. It paints before the app's CSS loads, so its few colours mirror
         src/styles/tokens.css (navy #1C252D, orange #FFAE61, white #F1F1F1). */
      .fc-stale #root { visibility: hidden; }
      #fci { display: none; }
      .fci-run #fci { display: block; position: fixed; inset: 0; z-index: 9999; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .fci-hold .header-brand { opacity: 0; }
      .header-brand { transition: opacity .35s ease; }
      #fci .fci-strip, #fci .fci-sheet { position: absolute; left: 0; right: 0; background: #F1F1F1 url("/textures/paper.webp?v=2") 0 0 / 384px; }
      [data-theme="night"] #fci .fci-strip, [data-theme="night"] #fci .fci-sheet { background: #1C252D url("/textures/navy.webp?v=2") 0 0 / 384px; }
      #fci .fci-strip { top: 0; height: 64px; z-index: 2; box-shadow: 0 1px 0 rgba(28,37,45,.12); }
      #fci .fci-sheet { top: 0; bottom: 0; z-index: 1; will-change: transform; }
      #fci .fci-sheet-a { z-index: 1; }  /* the part already torn away (it swings down from the tear front) */
      #fci .fci-sheet-b { z-index: 0; }  /* the part still attached */
      #fci .fci-sheet::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(28,37,45,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(28,37,45,.06) 1px, transparent 1px); background-size: 48px 48px; }
      [data-theme="night"] #fci .fci-sheet::before { background-image: linear-gradient(rgba(241,241,241,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(241,241,241,.05) 1px, transparent 1px); }
      #fci .fci-sheet::after { content: ""; position: absolute; inset: 22px; top: 86px; border: 1.5px solid rgba(28,37,45,.28); }
      [data-theme="night"] #fci .fci-sheet::after { border-color: rgba(241,241,241,.2); }
      #fci .fci-perf { position: absolute; left: 0; right: 0; top: 63px; height: 0; border-top: 2px dashed rgba(28,37,45,.22); z-index: 3; }
      [data-theme="night"] #fci .fci-perf { border-color: rgba(241,241,241,.2); }
      #fci .fci-tear { position: absolute; left: 0; top: 40px; width: 100%; height: 48px; z-index: 4; overflow: visible; pointer-events: none; }
      #fci .fci-tear path { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: var(--len, 4000); stroke-dashoffset: var(--len, 4000); }
      [data-theme="night"] #fci .fci-tear path { stroke: rgba(241,241,241,.35); }
      #fci .fci-stage { position: absolute; left: 50%; top: 50%; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 22px; transform: translate(-50%, -50%); }
      #fci .fci-mark { width: 132px; height: auto; display: block; fill: #1C252D; transform-origin: 0 0; opacity: 0; filter: drop-shadow(0 2px 2px rgba(28,37,45,.18)); }
      [data-theme="night"] #fci .fci-mark { fill: #FFAE61; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
      #fci .fci-tag { margin: 0; font: 600 15px/1.3 "Satoshi", system-ui, sans-serif; letter-spacing: .02em; color: #1C252D; text-align: center; white-space: nowrap; }
      [data-theme="night"] #fci .fci-tag { color: #F1F1F1; }
      #fci .fci-tag span { opacity: 0; transition: opacity .4s ease; }
      #fci .fci-tag b { font-weight: 600; color: #D15334; }
      [data-theme="night"] #fci .fci-tag b { color: #FFAE61; }
      #fci.is-in .fci-mark { animation: fci-in calc(.8s * var(--fci-k, 1)) ease-out forwards; }
      #fci.is-stamp .fci-mark { animation: fci-stamp calc(.8s * var(--fci-k, 1)) cubic-bezier(.3,.7,.3,1) forwards; }
      #fci.is-fly .fci-mark { opacity: 1; transition: transform calc(.65s * var(--fci-k, 1)) cubic-bezier(.6,0,.2,1), opacity .3s ease calc(.5s * var(--fci-k, 1)); }
      #fci.is-fly .fci-tag { opacity: 0; transition: opacity .25s ease; }
      #fci.is-drop .fci-strip, #fci.is-drop .fci-perf, #fci.is-drop .fci-tear { transform: translateY(-110%); transition: transform .5s ease-in .1s; }
      #fci.is-drop .fci-stage { opacity: 0; transition: opacity .2s ease; }
      #fci.is-fade { opacity: 0; transition: opacity .35s ease; }
      @keyframes fci-in { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes fci-stamp { 0% { opacity: 1; transform: scale(1); } 35% { transform: scale(.9); filter: drop-shadow(0 0 0 rgba(28,37,45,.1)); } 70% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
      /* if anything goes wrong, never leave the sheet covering the site */
      .fci-run #fci { animation: fci-failsafe 0s linear 16s forwards; }
      @keyframes fci-failsafe { to { visibility: hidden; pointer-events: none; } }
    </style>
  </head>
  <body>
    <div id="fci" aria-hidden="true">
      <div class="fci-sheet fci-sheet-b"></div>
      <div class="fci-sheet fci-sheet-a"></div>
      <div class="fci-strip"></div>
      <div class="fci-perf"></div>
      <svg class="fci-tear" preserveAspectRatio="none"><path /></svg>
      <div class="fci-stage">
        <svg class="fci-mark" viewBox="0 0 41.9 29.36"><path d="M10.91,12.28l2.93-2.93v8.55c0,2.2-1.18,4.24-3.1,5.33L0,29.36v-6.17l10.91-10.91Z"/><path d="M15.19,10.02h15.49c1.6,0,2.9,1.3,2.9,2.9v5.22c0,1.6-1.3,2.9-2.9,2.9h-12.59c-1.6,0-2.9-1.3-2.9-2.9v-8.12Z"/><path d="M41.9,0v5.78c0,1.6-1.3,2.9-2.9,2.9H15.19v-.67L23.19,0h18.71Z"/></svg>
        <p class="fci-tag">Designing spaces. <b>Empowering communities.</b></p>
      </div>
    </div>
    <script>
      // Opening animation: stamp → glide to the header logo → tear the sheet off the pad.
      // It never waits longer than it must: the tear happens as soon as the first page has
      // rendered (or after 4 s at most), and a tap or key press skips straight to it.
      (function () {
        var d = document.documentElement, el = document.getElementById("fci");
        if (!d.classList.contains("fci-run")) { el.parentNode.removeChild(el); return; }
        var mode = d.classList.contains("fci-full") ? "full" : d.classList.contains("fci-quick") ? "quick" : "fade";
        var mark = el.querySelector(".fci-mark"), tag = el.querySelector(".fci-tag");
        var start = Date.now(), timers = [], torn = false;
        var M = window.__fcMotion || { intro: 1, tear: 1 };
        var at = function (ms, fn) { timers.push(setTimeout(fn, ms * M.intro)); };
        var finish = function () {
          timers.forEach(clearTimeout);
          d.classList.remove("fci-run", "fci-full", "fci-quick", "fci-fade", "fci-hold");
          if (el.parentNode) el.parentNode.removeChild(el);
        };
        var pageReady = function () {
          var main = document.getElementById("main");
          return !!(main && main.firstElementChild && !main.querySelector('[aria-busy="true"]'));
        };
        // the tagline types itself in, word by word
        tag.innerHTML = tag.innerHTML.replace(/(<b>)?([^<\s]+)(<\/b>)?/g, function (w, b1, word, b2) { return (b1 || "") + "<span>" + word + "</span>" + (b2 || ""); });
        var words = tag.querySelectorAll("span");
        if (mode !== "full") tag.style.display = "none";

        var flyToHeader = function () {
          // the visible header logo (day and night versions are both in the page; one is hidden)
          var tr = null;
          [].forEach.call(document.querySelectorAll(".header-brand img"), function (img) { var b = img.getBoundingClientRect(); if (b.width) tr = b; });
          el.classList.remove("is-in", "is-stamp");
          mark.style.opacity = 1;
          var r = mark.getBoundingClientRect();
          if (!tr || !tr.width) tr = { left: 24, top: 22, height: 30, width: 138 };
          var h = tr.height * (29.36 / 34.24); // the mark's share of the lockup's height
          var s = h / r.height;
          mark.style.transform = "translate(" + (tr.left - r.left) + "px," + (tr.top + (tr.height - h) / 2 - r.top) + "px) scale(" + s + ")";
          el.classList.add("is-fly");
        };
        // The sheet is ripped off the pad from the left: the tear runs along the perforation, the torn
        // part swings down from the tear front while the rest stays attached, then the whole sheet
        // falls away. Timing: Admin → Motion ("Tearing the sheet off").
        var tear = function () {
          if (torn) return; torn = true;
          var w = window.innerWidth, h = window.innerHeight, y = 24, pts = [[0, y]], x = 0, path = "M0," + y;
          while (x < w) { x += 4 + Math.random() * 12; y = Math.max(14, Math.min(34, y + (Math.random() - 0.5) * 10)); pts.push([Math.min(x, w), y]); path += " L" + Math.min(x, w).toFixed(1) + "," + y.toFixed(1); }
          var svg = el.querySelector(".fci-tear"), p = svg.querySelector("path");
          svg.setAttribute("viewBox", "0 0 " + w + " 48"); p.setAttribute("d", path);
          var len = Math.ceil(p.getTotalLength ? p.getTotalLength() : w * 1.3); p.style.setProperty("--len", len);
          var line = pts.map(function (q) { return q[0].toFixed(1) + "px " + (q[1] + 40).toFixed(1) + "px"; });
          var strip = el.querySelector(".fci-strip"), perf = el.querySelector(".fci-perf");
          var sa = el.querySelector(".fci-sheet-a"), sb = el.querySelector(".fci-sheet-b");
          strip.style.height = "90px";
          strip.style.clipPath = "polygon(0 0," + w + "px 0," + line.slice().reverse().join(",") + ")";
          // the sheet below the ragged line, cut at the tear front fx: a = left of it, b = right of it
          var cut = function (fx) {
            var left = [], right = [];
            pts.forEach(function (q, i) { if (q[0] <= fx) left.push(line[i]); else right.push(line[i]); });
            var fy = 64;
            sa.style.clipPath = left.length ? "polygon(" + left.join(",") + "," + fx.toFixed(1) + "px " + fy + "px," + fx.toFixed(1) + "px " + h + "px,0 " + h + "px)" : "inset(0 100% 0 0)";
            sb.style.clipPath = right.length ? "polygon(" + fx.toFixed(1) + "px " + fy + "px," + right.join(",") + "," + w + "px " + h + "px," + fx.toFixed(1) + "px " + h + "px)" : "inset(0 0 0 100%)";
            perf.style.clipPath = "inset(0 0 0 " + fx.toFixed(1) + "px)";
            sa.style.transformOrigin = fx.toFixed(1) + "px 64px";
          };
          cut(0);
          if (w > 800) sa.style.filter = "drop-shadow(0 10px 16px rgba(28,37,45,.2))"; // depth on larger screens (costly on phones)
          d.classList.remove("fci-hold"); // the real header logo fades in under the mark
          var dur = (mode === "full" ? 1300 : 800) * M.tear, t0 = 0;
          var ease = function (q) { return q < 0.5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2; };
          var rip = function (now) {
            if (!t0) t0 = now;
            var q = Math.min(1, (now - t0) / dur), e = ease(q), fx = e * w;
            cut(fx);
            // the torn part swings further as the tear runs on, and sags a little
            sa.style.transform = "translateY(" + (e * 10).toFixed(1) + "px) rotate(" + (-11 * Math.pow(e, 1.4)).toFixed(2) + "deg)";
            p.style.strokeDashoffset = String(len * (1 - e));
            if (q < 1) return requestAnimationFrame(rip);
            // free: the whole sheet falls away, the stub at the top lifts off
            sa.style.transition = "transform " + (0.75 * M.tear).toFixed(2) + "s cubic-bezier(.55,0,.8,.35)";
            sa.style.transformOrigin = w + "px 64px";
            sa.style.transform = "translate(" + (-0.08 * w).toFixed(0) + "px," + (h * 1.15).toFixed(0) + "px) rotate(-24deg)";
            el.classList.add("is-drop");
            setTimeout(finish, (850 * M.tear) + 100);
          };
          requestAnimationFrame(rip);
        };
        var tearWhenReady = function (deadline) {
          if (pageReady() || Date.now() > deadline) return tear();
          at(100, function () { tearWhenReady(deadline); });
        };
        var skip = function () {
          if (torn) return;
          if (!el.classList.contains("is-fly")) { mark.style.opacity = 1; flyToHeader(); }
          M = { intro: M.intro, tear: M.tear * 0.5 }; // a tap or key press: rip it off quicker
          tearWhenReady(Date.now() + 1200);
        };
        el.addEventListener("pointerdown", skip);
        window.addEventListener("keydown", skip, { once: true });

        if (mode === "fade") {
          mark.style.opacity = 1;
          var fadeOut = function () { d.classList.remove("fci-hold"); el.classList.add("is-fade"); at(380, finish); };
          var waitFade = function () { if (pageReady() || Date.now() - start > 4000) fadeOut(); else at(100, waitFade); };
          at(350, waitFade);
          return;
        }
        if (mode === "quick") {
          el.classList.add("is-in");
          at(320, flyToHeader);
          at(900, function () { tearWhenReady(start + 4000 * M.intro); });
          return;
        }
        // full (≈ 3 s before the tear at 1×; Admin → Motion "Opening animation" scales it). The start is
        // unhurried on purpose (owner, 2026-10-24: "initially it's a bit too fast").
        el.classList.add("is-in");
        at(800, function () { el.classList.remove("is-in"); el.classList.add("is-stamp"); });
        words.forEach(function (wd, i) { at(1100 + i * 200, function () { wd.style.opacity = 1; }); });
        at(2300, flyToHeader);
        at(3000, function () { tearWhenReady(start + 5800 * M.intro); });
      })();
    </script>
    <div id="root"></div>
    <noscript><p style="padding:24px;font-family:system-ui">Formcraft needs JavaScript to show this site. Call +256 753 929 921 or email formcraftdesign@gmail.com.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>

    <script>
      // Pick the paper edition before first paint: saved choice, else the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem("fc-theme"); } catch (e) {}
        if (t !== "day" && t !== "night") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
